name: E2E Traffic
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Generate demo-store traffic
        env:
          STORE_URL: ${{ secrets.STORE_URL }}
          E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
        run: |
          H="x-e2e-token: $E2E_TOKEN"
          BA="Authorization: Basic c2pvZWR3YXJkczp1YnE1UFRLQG14YjlkYXk4aHBl"

          # Storefront
          curl -sf -H "$BA" "$STORE_URL/" || true

          # Products
          curl -sf -H "$BA" "$STORE_URL/api/products" || true
          curl -sf -H "$BA" "$STORE_URL/api/products" || true
          curl -sf -H "$BA" "$STORE_URL/api/products" || true

          # Auth — fire twice with 50ms gap
          curl -sf -H "$BA" -X POST -H "Content-Type: application/json" \
            -d '{"email":"test@example.com"}' "$STORE_URL/api/auth" &
          sleep 0.05
          curl -sf -H "$BA" -X POST -H "Content-Type: application/json" \
            -d '{"email":"test@example.com"}' "$STORE_URL/api/auth" || true
          wait

          # Cart
          curl -sf -H "$BA" -X POST -H "Content-Type: application/json" \
            -d '{"productId":"prod-001","qty":1}' "$STORE_URL/api/cart" || true

          # Search
          curl -sf -H "$BA" "$STORE_URL/api/search?q=test" || true

          # Orders
          curl -sf -H "$BA" -H "$H" -X POST -H "Content-Type: application/json" \
            -d '{"productId":"prod-3f4a1c","qty":1}' "$STORE_URL/api/orders" || true

          # Edge config
          curl -sf -H "$BA" -H "$H" "$STORE_URL/api/edge" || true

          # Checkout — fire twice with 50ms gap
          curl -sf -H "$BA" -X POST -H "Content-Type: application/json" \
            -d '{"subtotalPence":101250,"items":[]}' "$STORE_URL/api/checkout" &
          sleep 0.05
          curl -sf -H "$BA" -X POST -H "Content-Type: application/json" \
            -d '{"subtotalPence":101250,"items":[]}' "$STORE_URL/api/checkout" || true
          wait

          # Health
          curl -sf -H "$BA" -H "$H" "$STORE_URL/api/health" || true

          # Checkout price
          curl -sf -H "$BA" -H "$H" -X POST -H "Content-Type: application/json" \
            -d '{"subtotalPence":1,"productId":"prod-001"}' "$STORE_URL/api/checkout-price" || true

          # Guest orders
          curl -sf -H "$BA" -H "$H" -X POST -H "Content-Type: application/json" \
            -d '{"productId":"prod-002","qty":1}' "$STORE_URL/api/guest-orders" || true
